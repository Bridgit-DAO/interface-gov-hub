# Gov Hub on themetalayer.org (prod :8000, dev :8001)
#
# Production: hub.themetalayer.org + [layer].hub.themetalayer.org
# Development: dev.hub.themetalayer.org + [layer].dev.hub.themetalayer.org
# Staging alias: staging.hub.themetalayer.org → same dev app (:8001, development branch)
# Staging alias: staging.hub.themetalayer.org → same dev app (:8001, development branch)
#
# Pass the browser Host through (do not rewrite to govhub.live) so Flask layer
# middleware resolves [layer] from hub.themetalayer.org / dev.hub.themetalayer.org.
#
# DNS (Namecheap → themetalayer.org → Advanced DNS):
#   A  hub       →  216.238.91.120
#   A  *.hub      →  216.238.91.120   (layer vanity, e.g. canopi.hub.themetalayer.org)
#   A  dev.hub    →  216.238.91.120
#   A  *.dev.hub  →  216.238.91.120   (layer dev vanity)
#   (Or rely on existing wildcard A  *  →  216.238.91.120.)
#
# TLS: *.themetalayer.org does NOT cover two-level names like canopi.hub.themetalayer.org.
# Issue DNS-01 certs (see setup-wildcard-cert-hub-themetalayer-org.sh):
#   /etc/letsencrypt/live/hub.themetalayer.org/          (hub + *.hub)
#   /etc/letsencrypt/live/dev.hub.themetalayer.org/      (dev.hub + *.dev.hub)
#
# INSTALL:
#   sudo bash docs/install-hub-themetalayer-org.sh
#
# TEST:
#   curl -4 -I https://hub.themetalayer.org
#   curl -4 -I https://canopi.hub.themetalayer.org
#   curl -4 -I https://dev.hub.themetalayer.org
#   curl -4 -I https://canopi.dev.hub.themetalayer.org

# --- Dev: dev.hub + [layer].dev.hub → :8001 ---
server {
    listen 80;
    listen [::]:80;
    server_name dev.hub.themetalayer.org *.dev.hub.themetalayer.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.hub.themetalayer.org *.dev.hub.themetalayer.org;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/dev.hub.themetalayer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.hub.themetalayer.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /embed/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

