# Gov Hub alias: hub.themetalayer.org → same app as govhub.live (prod :8000)
#
# Public fallback when govhub.live is blocked on some networks but themetalayer.org
# hostnames work (same VPS 216.238.91.120). Nginx sends Host: govhub.live upstream so
# Flask behaves like production on govhub.live.
#
# PREREQUISITES (Namecheap → themetalayer.org → Advanced DNS):
#   A  hub  →  216.238.91.120
#   (Or rely on existing wildcard A  *  →  216.238.91.120.)
#
# TLS: Wildcard cert *.themetalayer.org (no separate certbot run required):
#   /etc/letsencrypt/live/themetalayer.org/
# Optional dedicated cert:
#   sudo certbot certonly --nginx -d hub.themetalayer.org \
#     --non-interactive --agree-tos -m admin@govhub.live
#
# INSTALL (on VPS):
#   sudo cp docs/nginx-hub-themetalayer-org.conf /etc/nginx/sites-available/hub.themetalayer.org
#   sudo ln -sf /etc/nginx/sites-available/hub.themetalayer.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TEST:
#   curl -4 -I http://hub.themetalayer.org
#   curl -4 -I https://hub.themetalayer.org

server {
    listen 80;
    listen [::]:80;
    server_name hub.themetalayer.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hub.themetalayer.org;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/themetalayer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/themetalayer.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /embed/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host govhub.live;
        proxy_set_header X-Forwarded-Host govhub.live;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host govhub.live;
        proxy_set_header X-Forwarded-Host govhub.live;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
