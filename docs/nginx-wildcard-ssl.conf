# Nginx configuration for wildcard subdomain routing WITH SSL
# For: themetalayer.org and *.themetalayer.org (overweb, the-overweb, etc.)
#
# PREREQUISITES:
# 1. Wildcard DNS A record: *.themetalayer.org -> 216.238.91.120
# 2. Wildcard SSL cert - run:
#    sudo certbot certonly --dns-cloudflare \
#      --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#      -d themetalayer.org -d "*.themetalayer.org"
#
# INSTALL:
#   sudo cp docs/nginx-wildcard-ssl.conf /etc/nginx/sites-available/themetalayer.org
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name themetalayer.org *.themetalayer.org;

    # /dev/ on any layer subdomain → dev server (port 8001)
    location /dev/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dev;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/themetalayer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/themetalayer.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name themetalayer.org *.themetalayer.org;
    return 301 https://$host$request_uri;
}
