# Gov Hub dev: dev.hub.themetalayer.org + *.dev.hub.themetalayer.org → Flask :8001
#
# PREREQUISITES (Namecheap → themetalayer.org → Advanced DNS):
#   A  dev.hub  →  216.238.91.120
#   A  *.dev.hub  →  216.238.91.120  (if supported)
#
# TLS (DNS-01 wildcard — see setup-wildcard-cert-hub-themetalayer-org.sh):
#   /etc/letsencrypt/live/dev.hub.themetalayer.org/
#
# INSTALL:
#   sudo cp docs/nginx-dev-hub-themetalayer-org.conf /etc/nginx/sites-available/dev.hub.themetalayer.org
#   sudo ln -sf /etc/nginx/sites-available/dev.hub.themetalayer.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TEST:
#   curl -4 -I https://dev.hub.themetalayer.org
#   curl -4 -I https://canopi.dev.hub.themetalayer.org

server {
    listen 80;
    listen [::]:80;
    server_name dev.hub.themetalayer.org *.dev.hub.themetalayer.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.hub.themetalayer.org *.dev.hub.themetalayer.org;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/dev.hub.themetalayer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.hub.themetalayer.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /embed/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
