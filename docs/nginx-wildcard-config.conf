# Nginx configuration for wildcard subdomain routing
# For: themetalayer.org and *.themetalayer.org
#
# PREREQUISITES:
# - Wildcard DNS A record: *.themetalayer.org -> YOUR_SERVER_IP (216.238.91.120)
# - Wildcard SSL cert (see docs/DEPLOYMENT-CHECKLIST.md)
#
# INSTALL:
#   sudo cp docs/nginx-wildcard-config.conf /etc/nginx/sites-available/themetalayer.org
#   sudo ln -sf /etc/nginx/sites-available/themetalayer.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name themetalayer.org *.themetalayer.org;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SSL - managed by Certbot (run certbot after placing this file)
    listen 80;
    # After certbot: listen 443 ssl; (see certbot instructions)
    # ssl_certificate /etc/letsencrypt/live/themetalayer.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/themetalayer.org/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
}
