# Interface Hub (canonical Gov Hub) on interfacehub.net
#
# Production: interfacehub.net + [layer].interfacehub.net → :8000
# Development: dev.interfacehub.net + [layer].dev.interfacehub.net → :8001
# Staging alias: staging.interfacehub.net → :8001
# www → apex
#
# Pass the browser Host through so Flask layer middleware resolves [layer]
# from *.interfacehub.net / *.dev.interfacehub.net.
#
# DNS (Cloudflare zone interfacehub.net, DNS-only / grey cloud):
#   A  @        →  216.238.91.120
#   A  www      →  216.238.91.120
#   A  *        →  216.238.91.120
#   A  dev      →  216.238.91.120
#   A  *.dev    →  216.238.91.120
#   A  staging  →  216.238.91.120
#
# TLS (DNS-01 wildcards; see setup-wildcard-cert-interfacehub-net.sh):
#   /etc/letsencrypt/live/interfacehub.net/          (apex + www + *)
#   /etc/letsencrypt/live/dev.interfacehub.net/      (dev + *.dev)
#
# INSTALL:
#   sudo bash docs/install-interfacehub-net.sh

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name interfacehub.net www.interfacehub.net *.interfacehub.net
                 dev.interfacehub.net *.dev.interfacehub.net
                 staging.interfacehub.net;
    return 301 https://$host$request_uri;
}

# --- www → apex ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.interfacehub.net;

    ssl_certificate /etc/letsencrypt/live/interfacehub.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interfacehub.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://interfacehub.net$request_uri;
}

# --- Dev: dev + [layer].dev → :8001 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.interfacehub.net *.dev.interfacehub.net;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/dev.interfacehub.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.interfacehub.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /embed/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# --- Staging alias → :8001 (must precede prod wildcard) ---
