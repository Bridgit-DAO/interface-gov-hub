# After interfacehub.net is live, replace hub.themetalayer.org vhost with this
# so old bookmarks and layer vanity hosts keep working.
#
# INSTALL (only after https://interfacehub.net/ returns Gov Hub):
#   sudo cp docs/nginx-hub-themetalayer-org-redirect-to-interfacehub.conf \
#     /etc/nginx/sites-available/hub.themetalayer.org
#   sudo nginx -t && sudo systemctl reload nginx

map $host $interfacehub_target {
    default                         "";
    hub.themetalayer.org            interfacehub.net;
    staging.hub.themetalayer.org    staging.interfacehub.net;
    dev.hub.themetalayer.org        dev.interfacehub.net;
    ~^(?<ih_layer>[^.]+)\.hub\.themetalayer\.org$         $ih_layer.interfacehub.net;
    ~^(?<ih_layer>[^.]+)\.dev\.hub\.themetalayer\.org$    $ih_layer.dev.interfacehub.net;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.themetalayer.org *.hub.themetalayer.org
                 dev.hub.themetalayer.org *.dev.hub.themetalayer.org
                 staging.hub.themetalayer.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.hub.themetalayer.org *.dev.hub.themetalayer.org;

    ssl_certificate /etc/letsencrypt/live/dev.hub.themetalayer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.hub.themetalayer.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($interfacehub_target = "") {
        return 404;
    }
    return 301 https://$interfacehub_target$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hub.themetalayer.org *.hub.themetalayer.org staging.hub.themetalayer.org;

    ssl_certificate /etc/letsencrypt/live/hub.themetalayer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.themetalayer.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($interfacehub_target = "") {
        return 404;
    }
    return 301 https://$interfacehub_target$request_uri;
}
