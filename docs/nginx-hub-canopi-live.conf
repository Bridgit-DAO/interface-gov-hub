# Gov Hub alias: hub.canopi.live → same app as govhub.live (prod :8000)
#
# Use when clients on some IPv4 paths block TLS to hostnames containing "gov"
# but canopi.live works (same VPS, different SNI).
#
# PREREQUISITES (Namecheap → canopi.live → Advanced DNS):
#   A  hub  →  216.238.91.120
#   (No AAAA required — canopi.live is IPv4-only and that path works for affected users.)
#
# WHEN TO USE:
#   User on Spectrum/residential IPv4 sees TLS errors on govhub.live but canopi.live works,
#   and tcpdump on this VPS shows no packets for govhub. Deploy this alias.
#   Full runbook: docs/GOVHUB_CONNECTIVITY_OUTAGE.md
#
# INSTALL (on Vultr server):
#   sudo certbot certonly --nginx -d hub.canopi.live \
#     --non-interactive --agree-tos -m admin@govhub.live
#   sudo cp docs/nginx-hub-canopi-live.conf /etc/nginx/sites-available/hub.canopi.live
#   sudo ln -sf /etc/nginx/sites-available/hub.canopi.live /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TEST (from Mac):
#   curl -4 -vI https://hub.canopi.live

server {
    listen 80;
    listen [::]:80;
    server_name hub.canopi.live;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hub.canopi.live;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/hub.canopi.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.canopi.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /embed/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host govhub.live;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host govhub.live;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
