# Nginx: Gov Hub on govhub.live
#
# - govhub.live, www.govhub.live, *.govhub.live  → gov-hub-prod (e.g. 127.0.0.1:8000)
# - dev.govhub.live, *.dev.govhub.live         → gov-hub-dev  (e.g. 127.0.0.1:8001)
#
# Nginx picks the more specific server_name: exact dev.govhub.live wins over *.govhub.live,
# so the dev site is not served by the prod block. *.dev.govhub.live is two labels under
# govhub.live, so it does not match *.govhub.live.
#
# Flask resolves [layer].govhub.live and [layer].dev.govhub.live via BASE_DOMAINS + Host
# (see middleware _do_resolve_layer_from_host).
#
# PREREQUISITES:
# 1. DNS (example):
#      A @, A www, A *     → prod server IP   (layer.foo.govhub.live, dev.govhub.live, etc.)
#      A dev, A *.dev      → same IP          ([layer].dev.govhub.live)
#    (Exact records depend on your DNS provider; wildcards must cover *.dev.govhub.live.)
#
# 2. TLS (DNS-01), same names for all providers:
#      -d govhub.live -d "*.govhub.live" -d "*.dev.govhub.live"
#    → /etc/letsencrypt/live/govhub.live/
#
#    Namecheap (or any non-Cloudflare DNS): run from repo root on the server:
#      sudo bash setup-wildcard-cert-govhub-dns-multi.sh
#    (Creates / uses /etc/letsencrypt/dns-multi-govhub.ini – see script header.)
#
#    Cloudflare ONLY if the govhub.live zone is actually on Cloudflare:
#      setup-wildcard-cert-govhub-cloudflare.sh
#
# INSTALL:
#   sudo cp docs/nginx-govhub-wildcard-ssl.conf /etc/nginx/sites-available/govhub.live
#   sudo ln -sf /etc/nginx/sites-available/govhub.live /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# --- Dev: dev.govhub.live + layer.dev.govhub.live → port 8001 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.govhub.live *.dev.govhub.live;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/govhub.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/govhub.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /embed/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# --- Prod: apex + www + *.govhub.live → port 8000 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name govhub.live www.govhub.live *.govhub.live;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/govhub.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/govhub.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /embed/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTP → HTTPS (all Gov Hub hostnames)
server {
    listen 80;
    listen [::]:80;
    server_name govhub.live www.govhub.live *.govhub.live dev.govhub.live *.dev.govhub.live;
    return 301 https://$host$request_uri;
}
